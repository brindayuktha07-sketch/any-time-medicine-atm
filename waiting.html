<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waiting for Doctor - Any Time Medicine ATM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">
        <h1>Any Time Medicine ATM</h1>
    </header>

    <main class="waiting-page">

        <section class="waiting-card">

            <div class="waiting-icon">🩺</div>

            <h2>Finding a Doctor</h2>

            <p>
                Your consultation request has been sent.
            </p>

            <p class="waiting-message">
                Please wait while we connect you with an available doctor.
            </p>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <button id="cancelBtn">
                Cancel Consultation
            </button>

        </section>

    </main>

    <script src="waiting.js"></script>

</body>

</html>
