<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Dashboard - Any Time Medicine ATM</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           HIGH CONTRAST MODE
        ========================================= */

        body.high-contrast {
            background: #000 !important;
            color: #fff !important;
        }

        body.high-contrast .dashboard-header {
            background: #000 !important;
            color: #fff !important;
            border-bottom: 2px solid #fff;
        }

        body.high-contrast .dashboard-header h1 {
            color: #fff !important;
        }

        body.high-contrast .dashboard-welcome h2,
        body.high-contrast .dashboard-welcome p {
            color: #fff !important;
        }

        body.high-contrast .dashboard-card {
            background: #000 !important;
            color: #fff !important;
            border: 3px solid #fff !important;
            box-shadow: none !important;
        }

        body.high-contrast .dashboard-card h3,
        body.high-contrast .dashboard-card p {
            color: #fff !important;
        }

        /* Keep buttons BLUE */
        body.high-contrast button {
            background: #2864e6 !important;
            color: #fff !important;
            border: 2px solid #fff !important;
        }

        body.high-contrast button:hover {
            background: #1d4ed8 !important;
        }

        /* =========================================
           HIGH CONTRAST BUTTON
        ========================================= */

        #contrastBtn {
            cursor: pointer;
        }
    </style>

</head>

<body>

    <header class="dashboard-header">

        <h1>Any Time Medicine ATM</h1>

        <div class="accessibility-controls">

            <!-- Large Text REMOVED -->

            <button id="contrastBtn">
                ◐ High Contrast
            </button>

        </div>

    </header>


    <main class="dashboard">

        <section class="dashboard-welcome">

            <h2>Doctor Dashboard</h2>

            <p>
                Welcome, Dr. <span id="doctorName"></span>
            </p>

        </section>


        <section id="waitingArea">

            <div class="dashboard-card">

                <h3>🩺 Incoming Consultation</h3>

                <div id="patientRequest">

                    <p>
                        Checking for patient requests...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="doctor-dashboard.js"></script>


    <script>

        /* =========================================
           HIGH CONTRAST
        ========================================= */

        const contrastBtn =
            document.getElementById("contrastBtn");


        /* Restore saved setting */

        if (
            localStorage.getItem("highContrast") === "true"
        ) {

            document.body.classList.add("high-contrast");

            contrastBtn.textContent =
                "◐ Normal Contrast";

        }


        /* Toggle High Contrast */

        contrastBtn.addEventListener(
            "click",
            function () {

                document.body.classList.toggle(
                    "high-contrast"
                );


                const enabled =
                    document.body.classList.contains(
                        "high-contrast"
                    );


                localStorage.setItem(
                    "highContrast",
                    enabled
                );


                if (enabled) {

                    contrastBtn.textContent =
                        "◐ Normal Contrast";

                } else {

                    contrastBtn.textContent =
                        "◐ High Contrast";

                }

            }
        );

    </script>

</body>

</html>
