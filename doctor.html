<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Any Time Medicine ATM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="welcome-card">

            <h1>Doctor Registration</h1>

            <p class="subtitle">
                Register this device for doctor access.
            </p>

            <form id="doctorForm">

                <input
                    type="text"
                    id="doctorName"
                    placeholder="Doctor Name"
                    required
                >

                <input
                    type="text"
                    id="doctorId"
                    placeholder="Doctor ID"
                    required
                >

                <button type="submit">
                    Register as Doctor
                </button>

            </form>

        </section>

    </main>

    <script src="doctor.js"></script>

</body>
</html>
