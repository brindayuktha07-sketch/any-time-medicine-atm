<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Any Time Medicine - Video Consultation</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            margin: 25px 10px 10px;
        }

        h2 {
            margin: 5px 10px 15px;
        }

        #role {
            font-size: 22px;
            font-weight: bold;
            margin: 10px;
        }

        #status {
            margin: 15px;
            color: #00ff88;
            font-size: 17px;
        }

        #videos {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px;
            width: 100%;
        }

        .video-box {
            width: 48%;
            min-width: 350px;
            max-width: 800px;
        }

        .video-box h3 {
            margin: 5px 0 12px;
            font-size: 20px;
        }

        video {
            width: 100%;
            height: 450px;
            object-fit: cover;
            background: #222;
            border-radius: 15px;
            border: 2px solid #333;
        }

        button {
            padding: 13px 28px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 800px) {

            .video-box {
                width: 95%;
                min-width: 0;
            }

            video {
                height: 300px;
            }

        }

    </style>

</head>


<body>

    <h1>Any Time Medicine</h1>

    <div id="role"></div>

    <h2>Video Consultation</h2>

    <div id="status">
        Connecting...
    </div>


    <div id="videos">

        <!-- YOUR VIDEO -->

        <div class="video-box">

            <h3>You</h3>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline>
            </video>

        </div>


        <!-- OTHER PERSON'S VIDEO -->

        <div class="video-box">

            <h3 id="otherRole">
                Other Participant
            </h3>

            <video
                id="remoteVideo"
                autoplay
                playsinline>
            </video>

        </div>

    </div>


    <div>

        <button onclick="startCall()">
            🎥 Start Call
        </button>

        <button onclick="endCall()">
            ❌ End Call
        </button>

    </div>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>


    <!-- WebRTC -->

    <script src="video-call.js"></script>


</body>

</html>
