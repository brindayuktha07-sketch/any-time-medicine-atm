<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Any Time Medicine - Video Consultation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        header {
            padding: 20px;
            text-align: center;
            background: #1f2937;
        }

        header h1 {
            margin: 0 0 8px;
        }

        #role {
            font-size: 20px;
            font-weight: bold;
        }

        #status {
            text-align: center;
            padding: 15px;
            color: #00ff88;
        }

        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .video-section {
            flex: 2;
            min-width: 600px;
        }

        .videos {
            display: flex;
            gap: 20px;
        }

        .video-box {
            flex: 1;
        }

        .video-box h3 {
            text-align: center;
            margin: 8px;
        }

        video {
            width: 100%;
            height: 400px;
            object-fit: cover;
            background: black;
            border-radius: 15px;
        }

        .controls {
            text-align: center;
            margin-top: 15px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .start {
            background: #2563eb;
            color: white;
        }

        .end {
            background: #dc2626;
            color: white;
        }

        .prescription {
            flex: 1;
            min-width: 320px;
            background: white;
            color: #111827;
            padding: 25px;
            border-radius: 15px;
        }

        .prescription h2 {
            margin-top: 0;
        }

        .medicine {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .medicine input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .add {
            background: #e5e7eb;
            color: #111827;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .dispense {
            width: 100%;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
        }

        #doctorPrescription {
            display: none;
        }

        #patientPrescription {
            display: none;
        }

        .medicine-card {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .medicine-card strong {
            font-size: 18px;
        }

        @media (max-width: 900px) {

            .video-section {
                min-width: 100%;
            }

            .videos {
                flex-direction: column;
            }

            video {
                height: 300px;
            }

            .prescription {
                min-width: 100%;
            }
        }
    </style>
</head>


<body>

<header>

    <h1>Any Time Medicine</h1>

    <div id="role">
        Loading...
    </div>

</header>


<div id="status">
    Waiting...
</div>


<div class="main">


    <!-- =========================
         VIDEO CALL
    ========================== -->

    <div class="video-section">

        <div class="videos">

            <div class="video-box">

                <h3>You</h3>

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline>
                </video>

            </div>


            <div class="video-box">

                <h3 id="otherRole">
                    Other Participant
                </h3>

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline>
                </video>

            </div>

        </div>


        <div class="controls">

            <button
                class="start"
                onclick="startCall()">

                🎥 Start Call

            </button>


            <button
                class="end"
                onclick="endCall()">

                ❌ End Call

            </button>

        </div>

    </div>


    <!-- =========================
         DOCTOR PRESCRIPTION
    ========================== -->

    <div
        id="doctorPrescription"
        class="prescription">

        <h2>💊 Prescription</h2>

        <p>
            Add the medicines you want to prescribe.
        </p>


        <div id="medicineList">

            <div class="medicine">

                <input
                    class="medicineName"
                    type="text"
                    placeholder="Medicine name">

                <input
                    class="medicineDosage"
                    type="text"
                    placeholder="Dosage (e.g. 500 mg)">

                <input
                    class="medicineQuantity"
                    type="number"
                    placeholder="Quantity">

                <input
                    class="medicineInstructions"
                    type="text"
                    placeholder="Instructions">

            </div>

        </div>


        <button
            class="add"
            onclick="addMedicine()">

            + Add Medicine

        </button>


        <button
            class="save"
            onclick="savePrescription()">

            Save Prescription

        </button>

    </div>


    <!-- =========================
         PATIENT PRESCRIPTION
    ========================== -->

    <div
        id="patientPrescription"
        class="prescription">

        <h2>💊 Your Prescription</h2>

        <div id="prescriptionList">

            <p>
                Waiting for doctor's prescription...
            </p>

        </div>


        <button
            class="dispense"
            onclick="dispenseMedicines()">

            💊 DISPENSE MEDICINES

        </button>

    </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="video-call.js"></script>


</body>

</html>
